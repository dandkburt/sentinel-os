name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      provider_mode:
        description: Policy secret provider mode to validate
        required: true
        default: credential-manager
        type: choice
        options:
          - auto
          - credential-manager
          - dpapi-file
          - env
      require_previous:
        description: Require previous-key material for overlap window validation
        required: true
        default: false
        type: boolean
      secret_target_prefix:
        description: Credential Manager target prefix (credential-manager mode)
        required: false
        default: SentinelOS/Policy
        type: string
      secret_file:
        description: DPAPI secret file path (dpapi-file mode)
        required: false
        default: C:\ProgramData\SentinelOS\policy_secrets.dpapi
        type: string

jobs:
  policy-readiness-script-smoke:
    runs-on: windows-2025
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate readiness script in devtest mode
        shell: pwsh
        env:
          SENTINEL_POLICY_SIGNING_KEY: ci-devtest-signing-key-123456
          SENTINEL_POLICY_SIGNING_KEY_ID: k1
        run: |
          $ErrorActionPreference = "Stop"
          $json = ./scripts/Test-PolicySecretProviderReadiness.ps1 -ProviderMode env -Environment devtest -OutputJson
          $result = $json | ConvertFrom-Json
          if (-not $result.ok) {
            throw "Policy readiness script smoke validation failed."
          }

  build:
    runs-on: windows-2025
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Configure
        run: cmake -S . -B build -DSENTINEL_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Debug

      - name: Test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          ctest --test-dir build --output-on-failure -C Debug -V 2>&1 | Tee-Object -FilePath ctest.log
          if ($LASTEXITCODE -ne 0) {
            throw "CTest failed with exit code $LASTEXITCODE"
          }

      - name: Upload ctest log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-log
          path: ctest.log
          if-no-files-found: ignore

      - name: Build managed orchestrator
        run: dotnet build src/managed/SentinelOS.Orchestration/SentinelOS.Orchestration.csproj -c Debug

      - name: Verify staged native contract
        shell: pwsh
        run: |
          $contract = "src/managed/SentinelOS.Orchestration/bin/Debug/net8.0/sentinel_runtime_contract.dll"
          if (-not (Test-Path $contract)) {
            throw "Expected staged native contract DLL not found: $contract"
          }

  startup-smoke:
    runs-on: windows-2025
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Configure
        run: cmake -S . -B build -DSENTINEL_BUILD_TESTS=ON

      - name: Build native runtime contract
        run: cmake --build build --config Debug --target sentinel_runtime_contract

      - name: Build managed orchestrator
        run: dotnet build src/managed/SentinelOS.Orchestration/SentinelOS.Orchestration.csproj -c Debug

      - name: Startup smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $output = dotnet run --project src/managed/SentinelOS.Orchestration/SentinelOS.Orchestration.csproj -c Debug 2>&1
          $output | Out-File -FilePath startup-smoke.log -Encoding utf8
          $output | ForEach-Object { Write-Host $_ }

          $text = ($output -join [Environment]::NewLine)

          if ($text -match "DllNotFound|Failed to locate sentinel_runtime_contract\.dll|EntryPointNotFound") {
            throw "Startup smoke test detected native runtime load failure signature."
          }

          if ($text -notmatch "bootstrap event: initialized") {
            throw "Startup smoke test did not observe runtime initialization event."
          }

          if ($text -notmatch "Runtime version:\s*0\.1\.0") {
            throw "Startup smoke test did not observe expected runtime version 0.1.0."
          }

      - name: Upload startup smoke log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: startup-smoke-log
          path: startup-smoke.log
          if-no-files-found: ignore

  policy-production-readiness-gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SENTINEL_POLICY_SECRET_PROVIDER: ${{ inputs.provider_mode }}
      SENTINEL_POLICY_ALLOW_ENV_FALLBACK: ""
      SENTINEL_POLICY_ALLOW_ENV_KEYS_ONLY: ""
      SENTINEL_POLICY_SECRET_TARGET_PREFIX: ${{ inputs.secret_target_prefix }}
      SENTINEL_POLICY_SECRET_FILE: ${{ inputs.secret_file }}
      SENTINEL_POLICY_SIGNING_KEY: ${{ secrets.POLICY_SIGNING_KEY }}
      SENTINEL_POLICY_SIGNING_KEY_ID: ${{ secrets.POLICY_SIGNING_KEY_ID }}
      SENTINEL_POLICY_PREVIOUS_SIGNING_KEY: ${{ secrets.POLICY_PREVIOUS_SIGNING_KEY }}
      SENTINEL_POLICY_PREVIOUS_SIGNING_KEY_ID: ${{ secrets.POLICY_PREVIOUS_SIGNING_KEY_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run policy readiness gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $args = @(
            "-ProviderMode", "${{ inputs.provider_mode }}",
            "-Environment", "production"
          )

          if ("${{ inputs.require_previous }}" -eq "true") {
            $args += "-RequirePrevious"
          }

          $args += "-OutputJson"

          $json = ./scripts/Test-PolicySecretProviderReadiness.ps1 @args
          $json | Out-File -FilePath policy-readiness-result.json -Encoding utf8
          $result = $json | ConvertFrom-Json

          if (-not $result.ok) {
            throw "Policy production readiness gate failed."
          }

      - name: Upload readiness result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-readiness-result
          path: policy-readiness-result.json
          if-no-files-found: ignore
